name: Build & Publish Prebuilt Release

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-x86_64-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libpulse-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball and compute Nix SRI hash
        id: package
        run: |
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          TAG="v${CARGO_VER}-${SHORT_SHA}"
          ASSET="swipe-adjust-x86_64-linux.tar.gz"

          mkdir -p dist/swipe-adjust
          cp target/release/swipe-adjust dist/swipe-adjust/
          tar -czf "${ASSET}" -C dist swipe-adjust

          SRI_HASH="sha256-$(openssl dgst -sha256 -binary "${ASSET}" | openssl base64 -A)"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ASSET}"

          echo "version=${CARGO_VER}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "asset=${ASSET}" >> "$GITHUB_OUTPUT"
          echo "hash=${SRI_HASH}" >> "$GITHUB_OUTPUT"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.package.outputs.tag }}"
          ASSET="${{ steps.package.outputs.asset }}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSET}" --clobber
          else
            gh release create "${TAG}" "${ASSET}" \
              --title "swipe-adjust ${TAG}" \
              --notes "Automated prebuilt x86_64-linux binary for NixOS flake consumption."
          fi

      - name: Update nix/release.json on branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git pull --rebase origin "${BRANCH}"

          jq -n \
            --arg version "${{ steps.package.outputs.version }}" \
            --arg url "${{ steps.package.outputs.url }}" \
            --arg hash "${{ steps.package.outputs.hash }}" \
            '{
              version: $version,
              "x86_64-linux": {
                url: $url,
                hash: $hash
              },
              "aarch64-linux": null
            }' > nix/release.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(nix): update prebuilt binary metadata for ${{ steps.package.outputs.tag }} [skip ci]"
            git push origin "HEAD:${BRANCH}"
          fi
